name: Build & Deploy to PROD

permissions:
  contents: read

env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
  IMAGE_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
  TOOLS_NAMESPACE: ${{ vars.OPENSHIFT_TOOLS_NAMESPACE }}

on:
  release:
    types: [published]

jobs:
  retag-deploy-images:
    name: Retag and deploy the images to the namespace
    runs-on: ubuntu-latest
    environment: prod
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install OC CLI tools
      uses: redhat-actions/openshift-tools-installer@1f130822bb0930e0ee02a119adcc3271a22b1499
      with:
        oc: "4"
        skip_cache: true
    - name: Give openshift context
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156
      with:
        openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        namespace: ${{ env.OPENSHIFT_NAMESPACE }}
        insecure_skip_tls_verify: false
    - name: Find and tag images for production
      run: |
        # Switch to tools namespace where images are stored
        oc project ${{ env.TOOLS_NAMESPACE }}
        
        # Tag the release test version as latest-prod
        oc tag wa-frontend:${{ github.ref_name }} wa-frontend:latest-prod
        oc tag wa-backend:${{ github.ref_name }} wa-backend:latest-prod
        oc tag wa-jobs:${{ github.ref_name }} wa-jobs:latest-prod
    - name: Run helm script
      run: |
        helm upgrade --install wa-prod ./wa-infra -f ./wa-infra/values-prod.yaml --set frontend.image.tag=${{ github.ref_name }} --set backend.image.tag=${{ github.ref_name }} --set jobs.image.tag=${{ github.ref_name }} --namespace ${{ env.OPENSHIFT_NAMESPACE }}
