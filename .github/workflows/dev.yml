name: Build & Deploy to DEV

permissions:
  contents: read

env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
  IMAGE_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-client:
    name: Build the clients image
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set short SHA
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    - name: Build frontend
      id: build_frontend_image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034
      with:
        image: wa-frontend
        tags: latest ${{ github.sha }}
        labels: |
          app=wa-frontend
        build-args: |
          BUILD_VERSION=${{ env.SHORT_SHA }}
        context: .
        containerfiles: |
          ./frontend/Dockerfile
    - name: Push the image to OpenShift Registry
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37
      with:
        image: ${{ steps.build_frontend_image.outputs.image }}
        tags: ${{ steps.build_frontend_image.outputs.tags }}
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ vars.OPENSHIFT_USER }}
        password: ${{ secrets.OPENSHIFT_TOKEN }}
      
    
  build-server:
    name: Build the backend image
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Build .NET
      id: build_backend_image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034
      with:
        image: wa-backend
        tags: latest ${{ github.sha }}
        labels: |
          app=wa-backend
        context: .
        containerfiles: |
          ./backend/Dockerfile
    - name: Push the image to OpenShift Registry
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37
      with:
        image: ${{ steps.build_backend_image.outputs.image }}
        tags: ${{ steps.build_backend_image.outputs.tags }}
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ vars.OPENSHIFT_USER }}
        password: ${{ secrets.OPENSHIFT_TOKEN }}

  build-jobs:
    name: Build the jobs image
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Build jobs
      id: build_jobs_image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034
      with:
        image: wa-jobs
        tags: latest ${{ github.sha }}
        labels: |
          app=wa-jobs
        context: .
        containerfiles: |
          ./jobs/Dockerfile
    - name: Push the image to OpenShift Registry
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37
      with:
        image: ${{ steps.build_jobs_image.outputs.image }}
        tags: ${{ steps.build_jobs_image.outputs.tags }}
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ vars.OPENSHIFT_USER }}
        password: ${{ secrets.OPENSHIFT_TOKEN }}

  deploy-images:
    name: Deploy the latest images to the namespace
    runs-on: ubuntu-latest
    needs: [build-server, build-client, build-jobs]
    environment: dev
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install OC CLI tools
      uses: redhat-actions/openshift-tools-installer@1f130822bb0930e0ee02a119adcc3271a22b1499
      with:
        oc: "4"
        skip_cache: true
    - name: Give openshift context
      uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156
      with:
        openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
        openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
        namespace: ${{ env.OPENSHIFT_NAMESPACE }}
        insecure_skip_tls_verify: false
    - name: Run helm script
      run: |
        helm upgrade --install wa-dev ./wa-infra -f ./wa-infra/values-dev.yaml --set frontend.image.tag=${{ github.sha }} --set backend.image.tag=${{ github.sha }} --set jobs.image.tag=${{ github.sha }} --namespace ${{ env.OPENSHIFT_NAMESPACE }}
